name: Build UnlockServer and Create Release

on:
  push:
    branches: [ 1.4-fix ]
  pull_request:
    branches: [ 1.4-fix ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装.NET Framework 4.8 SDK
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x86

    - name: 恢复NuGet包
      run: nuget restore UnlockServer.sln

    - name: 编译项目
      run: msbuild UnlockServer.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: 创建临时目录收集产物
      run: |
        mkdir -p build_output
        cp -r UnlockServer/bin/Release/* build_output/
        cp "蓝牙解锁工具-食用说明.md" build_output/
        cp "远程解锁3.1.0.exe" build_output/
      shell: bash

    - name: 压缩产物为ZIP包
      run: |
        powershell Compress-Archive -Path build_output/* -DestinationPath UnlockServer_1.4-fix.zip -Force
      shell: cmd

    - name: 上传构建产物（Artifact，改为ZIP包）
      uses: actions/upload-artifact@v4
      with:
        name: UnlockServer-Build-Zip
        path: UnlockServer_1.4-fix.zip  # 指向ZIP包，而非原目录

    - name: 创建GitHub Release（分支触发）
      if: github.event_name == 'push' && github.ref == 'refs/heads/1.4-fix'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: 1.4-fix-latest
        name: UnlockServer v1.4-fix Build
        body: |
          ## 更新说明
          - 修复蓝牙信号检测逻辑
          - 优化锁定延迟通知机制（2秒后单次通知，避免冗余）
          - 包含说明文档和远程解锁工具
          - 踢踢原作者的屁股
        # ========== 关键修正：指向ZIP包，而非零散文件 ==========
        files: UnlockServer_1.4-fix.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
